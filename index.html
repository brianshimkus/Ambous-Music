<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambous Music</title>
    <link rel="icon" type="image/svg+xml" href="favicon-new.svg">
    <link rel="icon" type="image/x-icon" href="favicon-new.ico">
    <link rel="apple-touch-icon" href="ambous-favicon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --night-black: #070706;
            --dark-bg: #0f0f0f;
            --champagne: #D6BEBA;
            --antique-gold: #B99B5F;
            --warm-ivory: #F5F0E7;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--warm-ivory);
            background-color: var(--dark-bg);
            overflow-x: hidden;
        }


        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a1a 100%);
        }

        .hero-content {
            text-align: center;
            max-width: 650px;
            animation: fadeInUp 0.8s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-lockup {
            max-width: 500px;
            width: 90%;
            height: auto;
            margin: 0 auto 2.5rem;
            display: block;
            object-fit: contain;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .social-links-container {
            margin-top: 2rem;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }

        .social-links-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .social-links-grid {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .social-link {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(214, 190, 186, 0.3);
            border-radius: 12px;
            text-decoration: none;
            color: var(--champagne);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: socialPulse 0.6s ease-out var(--delay, 0s);
        }

        @keyframes socialPulse {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .social-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(214, 190, 186, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-link:hover {
            border-color: var(--champagne);
            background-color: rgba(214, 190, 186, 0.05);
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(214, 190, 186, 0.1);
        }

        .social-link:hover::before {
            opacity: 1;
        }

        .social-link svg {
            width: 24px;
            height: 24px;
            stroke-width: 1.5;
            position: relative;
            z-index: 1;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .hero-lockup {
                max-width: 85%;
                margin: 0 auto 2rem;
            }

            .social-link {
                width: 50px;
                height: 50px;
            }

            .social-link svg {
                width: 20px;
                height: 20px;
            }

            .social-links-label {
                font-size: 0.7rem;
                margin-bottom: 1.25rem;
            }

            .social-links-grid {
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero" id="social">
        <div class="hero-content">
            <img src="hero-lockup.svg" alt="Ambous Music" class="hero-lockup">

            <div class="social-links-container">
                <p class="social-links-label">Connect on social</p>
                <div class="social-links-grid">
                    <a href="https://instagram.com/ambousmusic" target="_blank" class="social-link" style="--delay: 0s" title="Instagram">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="2" width="20" height="20" rx="4" ry="4"></rect>
                            <circle cx="12" cy="12" r="3.5"></circle>
                            <circle cx="17.5" cy="6.5" r="0.75"></circle>
                        </svg>
                    </a>
                    <a href="https://youtube.com/@ambousmusic" target="_blank" class="social-link" style="--delay: 0.1s" title="YouTube">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"></polygon>
                        </svg>
                    </a>
                    <a href="https://tiktok.com/@ambousmusic" target="_blank" class="social-link" style="--delay: 0.2s" title="TikTok">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
                        </svg>
                    </a>
                    <a href="https://facebook.com/ambousmusic" target="_blank" class="social-link" style="--delay: 0.3s" title="Facebook">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="9" y1="5" x2="9" y2="19"></line>
                            <line x1="9" y1="8" x2="13" y2="8"></line>
                            <line x1="13" y1="8" x2="13" y2="19"></line>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
